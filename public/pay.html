<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pay via UPI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      color: #0f172a;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      text-align: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ecfdf5;
      color: #059669;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 14px;
    }
    .payee-name {
      font-size: 18px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 6px;
      word-break: break-word;
    }
    .note-text {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 12px;
    }
    .amount {
      font-size: 38px;
      font-weight: 900;
      color: #16a34a;
      letter-spacing: -0.5px;
      margin-bottom: 20px;
    }
    .pay-btn-main {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #16a34a, #15803d);
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      border-radius: 12px;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(22, 163, 74, 0.35);
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
      margin-bottom: 14px;
    }
    .pay-btn-main:active {
      transform: scale(0.98);
    }
    .app-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    .app-chip {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 10px 6px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      text-decoration: none;
      color: #334155;
      font-size: 12px;
      font-weight: 600;
      transition: background 0.15s;
    }
    .app-chip:hover {
      background: #f1f5f9;
    }
    .app-icon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 800;
      color: #ffffff;
    }
    .gpay-bg { background: #4285f4; }
    .phonepe-bg { background: #5f259f; }
    .paytm-bg { background: #00b9f5; }
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 16px 0;
      color: #94a3b8;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e2e8f0;
    }
    .qr-container {
      background: #ffffff;
      padding: 12px;
      border-radius: 14px;
      display: inline-block;
      border: 1px solid #e2e8f0;
      margin-bottom: 12px;
    }
    .qr-img {
      display: block;
      width: 180px;
      height: 180px;
      border-radius: 8px;
      margin: 0 auto;
    }
    .upi-id-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      color: #475569;
      margin-top: 6px;
    }
    .copy-btn {
      background: #0f172a;
      color: #ffffff;
      border: none;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .copy-btn:hover { background: #334155; }
    .status-msg {
      font-size: 12px;
      color: #059669;
      margin-top: 10px;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      UPI Payment Request
    </div>

    <div class="payee-name" id="payee-name">Business</div>
    <div class="note-text" id="note-text"></div>
    <div class="amount" id="amount-text">₹0.00</div>

    <!-- Main Pay Now button (opens default UPI chooser) -->
    <a href="#" class="pay-btn-main" id="pay-btn-main">
      <span>Pay Now via Any UPI App</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
    </a>

    <!-- App specific buttons for mobile users -->
    <div class="app-grid">
      <a href="#" class="app-chip" id="gpay-btn">
        <div class="app-icon gpay-bg">G</div>
        <span>Google Pay</span>
      </a>
      <a href="#" class="app-chip" id="phonepe-btn">
        <div class="app-icon phonepe-bg">P</div>
        <span>PhonePe</span>
      </a>
      <a href="#" class="app-chip" id="paytm-btn">
        <div class="app-icon paytm-bg">₹</div>
        <span>Paytm</span>
      </a>
    </div>

    <div class="divider">Or scan with phone</div>

    <div class="qr-container">
      <img id="qr-img" class="qr-img" alt="Scan UPI QR Code" />
    </div>

    <div class="upi-id-box">
      <span id="upi-id-display">UPI ID</span>
      <button class="copy-btn" id="copy-btn" onclick="copyUpiId()">Copy</button>
    </div>

    <div class="status-msg" id="status-msg"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const pa = params.get('pa') || '';
    const pn = params.get('pn') || 'Merchant';
    const am = params.get('am') || '';
    const tn = params.get('tn') || '';

    // Populate UI
    document.getElementById('payee-name').textContent = pn;
    if (tn) {
      document.getElementById('note-text').textContent = tn;
    }
    const amtNum = parseFloat(am) || 0;
    document.getElementById('amount-text').textContent = '₹' + amtNum.toFixed(2);
    document.getElementById('upi-id-display').textContent = pa || 'No UPI ID';

    // Build UPI links
    let upiUrl = 'upi://pay?pa=' + encodeURIComponent(pa) + '&pn=' + encodeURIComponent(pn) + '&cu=INR';
    if (amtNum > 0) upiUrl += '&am=' + encodeURIComponent(amtNum.toFixed(2));
    if (tn) upiUrl += '&tn=' + encodeURIComponent(tn);

    const mainBtn = document.getElementById('pay-btn-main');
    mainBtn.href = upiUrl;

    // App shortcuts
    document.getElementById('gpay-btn').href = upiUrl;
    document.getElementById('phonepe-btn').href = upiUrl;
    document.getElementById('paytm-btn').href = upiUrl;

    // Generate QR code
    const qrImg = document.getElementById('qr-img');
    qrImg.src = 'https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=' + encodeURIComponent(upiUrl);

    // Auto-launch on mobile
    const isMobile = /Android|iPhone|iPad|iPod|Mobi/i.test(navigator.userAgent);
    if (isMobile && pa) {
      document.getElementById('status-msg').textContent = 'Opening your UPI app...';
      // Small timeout so DOM renders first
      setTimeout(() => {
        window.location.href = upiUrl;
      }, 400);
    }

    function copyUpiId() {
      if (!pa) return;
      navigator.clipboard.writeText(pa).then(() => {
        const btn = document.getElementById('copy-btn');
        btn.textContent = 'Copied!';
        document.getElementById('status-msg').textContent = 'UPI ID copied to clipboard!';
        setTimeout(() => {
          btn.textContent = 'Copy';
          document.getElementById('status-msg').textContent = '';
        }, 2500);
      });
    }
  </script>
</body>
</html>
